<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yhteydenottolomake</title>
</head>
<body>
    <style>
        label,
        button {
            display: block;
            margin-top: 10px;
        }
        input,
        textarea {
            width: 50%;
            padding: 5px;
            margin-top: 5px;
        }
    </style>

    <h1>Yhteydenottolomake</h1>

    <form>
        <label for="nimi">Nimi</label>
        <input id="nimi" name="nimi" type="text" required>
        <br>
        <label for="email">Sähköposti</label>
        <input id="email" name="email" type="email" placeholder="sähköposti@esimerkki.fi" required>
        <br>
        <label for="aihe">Aihe</label>
        <input id="aihe" name="aihe" type="text" required>
        <br>
        <label for="viesti">Viesti</label>
        <textarea id="viesti" name="viesti" type="text"></textarea>
        <br>
        <button type="submit">Lähetä</button>
    </form>

    <!--PÄÄSIVU-->
    <a href="../../../index.html">Pääsivulle</a>
</body>
</html>
