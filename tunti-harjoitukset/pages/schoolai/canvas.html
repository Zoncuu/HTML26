<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/style.css">
    <title>Canva-esimerkki</title>
</head>
<body>
    <h1>Canvas-esimerkki</h1>

    <canvas 
        id="piirtoAlusta" 
        width="800px" 
        height="600px">
    </canvas>  

    <script>  
        const canvas = document.getElementById("piirtoAlusta");     
        const konteksti = canvas.getContext("2d");  
          
        konteksti.fillStyle = "green";  
        konteksti.fillRect(100, 50, 200, 12);  
    </script>  
</body>  
</html>
